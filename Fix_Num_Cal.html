<!DOCTYPE html>
<html>
<head>
    <title>Fix Num Cal</title>
</head>
<body>

<script>

function calculate(num1, num2, opreator) {
    let result;

    switch (opreator) {
        case '+':
            result = num1 + num2;
            break;

        case '-':
            result = num1 - num2;
            break;
        
        case '*':
            result = num1 * num2;
            break;

        case '/':
            result = num1 / num2;
            break;

        default:
            result = "Error: Invalid Opreator";
    }
    return result;
}

console.log(calculate(10,10,"+"));
console.log(calculate(10,10,"-"));
console.log(calculate(10,10,"*"));
console.log(calculate(10,10,"/"));

</script>

</body>
</html>
