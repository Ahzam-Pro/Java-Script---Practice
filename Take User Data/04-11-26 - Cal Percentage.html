<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Percentage</title>
</head>
<body>

	<label for="Total_Marks">Enter Your Total Marks</label>
	<input type="number" id="Total_Marks" name="Total_Marks" placeholder="Enter Your Total Marks" required><br>
	
	<label for="Obtain_Marks">Enter Your Obation Marks</label>
	<input type="number" id="Obtain_Marks" name="Obtain_Marks" placeholder="Enter Your Obtain Marks" required><br>

	<button type="submit">Submit</button>

<script>
	
var	obtmarks;
var	totalmarks = document.getElementById("Total_Marks").value;

obtmarks =  document.getElementById("Obtain_Marks").value;
percentage = obtmarks/totalmarks*100;
document.write(percentage + "%");

</script>

</body>
</html>
