<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Odd and Even</title>
</head>
<body>

<label for="num"></label>
<input type="number" id="num" name="num" placeholder="Enter Your Number: " required>
<button type="submit" onclick="numCheck()">Submit Number</button>

<p id="result"></p>

<script>
	
function numCheck(){
	var num1 = Number(document.getElementById("num").value);

	if (num1 % 2 === 0) {
		document.getElementById("result").innerHTML= "The Number is Even: " + num1;
	} else {
		document.getElementById("result").innerHTML= "The Number is Odd: " + num1;
	}
}

</script>

</body>
</html>
