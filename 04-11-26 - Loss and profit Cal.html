<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Loss and Profit</title>
</head>
<body>

<script>
	
var	sp = Number(prompt("Enter Your Sell Amount"));
var cp = Number(prompt("Enter Your Cost Price"));

if (sp>cp) {
	Profit = sp-cp;

	Gain_Percentage = Profit/cp*100;

	document.write("The Profit is " + Profit + "<br>");

	document.write("Gain Percentage " + Gain_Percentage + "%");
} 
else if (sp<cp) {
	Loss = cp-sp;

	Loss_Percentage = Loss/cp*100;

	document.write("The loss is " + Loss  + "<br>");

	document.write("Gain Percentage " + Loss_Percentage + "%")
}
	
</script>

</body>
</html>
