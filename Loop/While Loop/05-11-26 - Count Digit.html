<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count</title>
</head>
<body>

<label for="num">Enter Your Number</label>
<input type="number" id="num" name="num" placeholder="Enter Number" required><br>
<button type="submit" onclick="countDigit()">Submit Number</button><br>

Total Digit: <span id="result"></span> 

<script>

function countDigit(){
	var number = Number(document.getElementById("num").value);
	var count= 0;

while (number>0){
	count++;
	number=Math.floor(number/10)
}

document.getElementById("result").innerHTML = count;
}

</script>
</body>
</html>
