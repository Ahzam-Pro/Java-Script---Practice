<!DOCTYPE html>
<html>
<body>

<script>
function checkNumber() {

    var marks = Number(prompt("Enter a marks"));

    if (marks > 90) {
        document.write(marks +" is A Grade");
    }
    else if (marks > 40){
        document.write(marks+" is B Grade");
    }
    else{
		document.write("FAIL");
    }
}

checkNumber();
</script>

</body>
</html>
