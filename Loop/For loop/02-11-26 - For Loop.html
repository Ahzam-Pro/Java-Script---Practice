<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Count</title>
</head>
<body>

<lable for="marks"> Enter Your Total Marks In %: </lable>
<input type="number" id="marks" name="marks" placeholder="Enter Your Marks in %" required>

<button type="submit" onclick="checkNumber()">Submit Your Grade</button>

<script>
    function checkNumber() {
        var marks = Number(document.getElementById("marks").value);

        if (marks > 100) {
            document.write(marks +" is A1 Grade");
        }
        else if (marks > 90){
            document.write(marks+" is A2 Grade");
        }
        else if (marks > 80){
            document.write(marks+" is B1 Grade");
        }
        else if (marks > 70){
            document.write(marks+" is B2 Grade");
        }
        else if (marks > 60){
            document.write(marks+" is C1 Grade");
        }
        else if (marks > 50){
            document.write(marks+" is C2 Grade");
        }
        else if (marks > 40){
            document.write(marks+" is D1 Grade");
        }
        else if (marks > 33){
            document.write(marks+" is D2 Grade");
        }
        else{
            document.write("FAIL");
        }
    }

    checkNumber();

</script>

</body>
</html>
