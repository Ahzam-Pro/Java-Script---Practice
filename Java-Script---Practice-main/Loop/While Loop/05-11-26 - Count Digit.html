<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Count</title>
<script>
	
  var number = Number(prompt("enter your Value"));
  var count= 0;

  while (number>0){
      count++;
      number=Math.floor(number/10)
  }

  document.write("Total Digit = " + count);


</script>

</head>
<body>

</body>
</html>
