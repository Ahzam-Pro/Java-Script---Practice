<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Loss and Profit</title>
</head>
<body>

<label for="SA">Total Sell Amount: </label>
<input type="number" id="SA" name="SA" placeholder="SA" required><br>

<label for="CA">Total Cost Price: </label>
<input type="number" id="CA" name="CA" placeholder="CA" required><br>

<button type="submit" onclick="los_pro_cal()">Submit</button><br>

<p id="result"></p>

<script>

function los_pro_cal(){

	var	sp = Number(document.getElementById("SA").value);
	var cp = Number(document.getElementById("CA").value);

	if (sp>cp) {
		Profit = sp-cp;

		Gain_Percentage = Profit/cp*100;

		document.getElementById("sp").innerHTML= "The Profit is " + Profit + "<br>";

		document.getElementById("sp").innerHTML= "Gain Percentage " + Gain_Percentage + "%";
	} 
	else if (sp<cp) {
		Loss = cp-sp;

		Loss_Percentage = Loss/cp*100;

		document.getElementById("cp").innerHTML= "The loss is " + Loss  + "<br>";

		document.getElementById("cp").innerHTML= "Loss Percentage " + Loss_Percentage + "%";
	}
}
</script>

</body>
</html>
