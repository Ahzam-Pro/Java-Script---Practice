<!DOCTYPE html>
<html>
<head>
    <title>Fix Num Cal</title>
</head>
<body>

<label for="num_1">Enter First Number</label>
<input type="number" id="num_1" name="num_1" placeholder="First Num" required><br>

<label for="num_2">Enter Second Number</label>
<input type="number" id="num_2" name="num_2" placeholder="Second Num" required><br>

<button type="submit" onclick="showResult()">Submit Numbers</button><br>

You Answer Will Display here: <br>
<p id="Cal_Result"></p>

<script>

function calculate(num1, num2, opreator) {

    var num1 = Number(document.getElementById("num_1").value);
    var num2 = Number(document.getElementById("num_2").value);


    let result;

    switch (opreator) {
        case '+':
            result = num1 + num2;
            break;

        case '-':
            result = num1 - num2;
            break;
        
        case '*':
            result = num1 * num2;
            break;

        case '/':
            result = num1 / num2;
            break;

        case '%':
            result = num1 % num2;
            break;

        case '^':
            result = num1 ** num2;
            break;

        default:
            result = "Error: Invalid Opreator";
    }
    return result;
}

function showResult() {

    var num1 = Number(document.getElementById("num_1").value);
    var num2 = Number(document.getElementById("num_2").value);

document.getElementById("Cal_Result").innerHTML = 
    num1 + " + " + num2 + " = " + calculate(num1,num2,"+") + "<br>" + 
    num1 + " - " + num2 + " = " + calculate(num1,num2,"-") + "<br>" +
    num1 + " + " + num2 + " = " + calculate(num1,num2,"+") + "<br>" +
    num1 + " * " + num2 + " = " + calculate(num1,num2,"*") + "<br>" +
    num1 + " / " + num2 + " = " + calculate(num1,num2,"/") + "<br>" +
    num1 + " % " + num2 + " = " + calculate(num1,num2,"%") + "<br>" +
    num1 + " ^ " + num2 + " = " + calculate(num1,num2,"^");
}

</script>
</body>
</html>
