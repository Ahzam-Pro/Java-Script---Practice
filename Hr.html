
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>

    <style>

    	* {
    		background: black;
    	}

    	#main-heading {
    		color: blue;
    	}

    	.description {
    		color: purple;
    	}

    	.card > p {
    		color: gray;
    	}

    	p {
    		color: pink;
    	}

    	input[type="email"]{
    		color: orange;
    	}

    	h2, h3, input {
    		color: whitesmoke;
    	}

    	div p {
    		text-align: center;
    	}

    </style>
</head>

<body>

    <h1 id="main-heading">Welcome to CSS Selectors</h1>

    <p class="description">
        This webpage demonstrates different CSS selectors.
    </p>

    <div class="card">

        <h2>Student Information</h2>

        <p>Name: Ahzam</p>

        <p>Learning: HTML and CSS</p>

        <section>
            <p>This is a nested paragraph.</p>
        </section>

    </div>

    <h3>Contact Form</h3>

    <input type="text" placeholder="Enter your name">

    <br><br>

    <input type="email" placeholder="Enter your email" required>

</body>
</html>
