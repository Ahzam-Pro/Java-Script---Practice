<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Odd and Even</title>
</head>
<body>

<script>
	
	var num1 = prompt("Enter Your Number: ")

	if (num1 % 2 === 0) {
		document.write("The Number is Even: " + num1)
	} else {
		document.write("The Number is Odd: " + num1)
	}

</script>

</body>
</html>
